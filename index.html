<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Libraries and Parks Tile Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    #menu {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      background: white;
      padding: 12px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
      font-family: Arial, sans-serif;
    }

    #menu h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }

    #menu p {
      margin: 0 0 10px 0;
      font-size: 12px;
      line-height: 1.4;
    }

    #menu button {
      display: block;
      margin: 6px 0;
      width: 160px;
      padding: 8px;
      border: none;
      background: #f2f2f2;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
    }

    #menu button:hover {
      background: #dddddd;
    }
  </style>
</head>

<body>
  <div id="menu">
    <h3>Seattle Libraries & Parks</h3>
    <p>Select a tile set:</p>

    <button onclick="showLayer('basemap-layer')">Basemap</button>
    <button onclick="showLayer('thematic-layer')">Thematic</button>
    <button onclick="showLayer('combined-layer')">Combined</button>
    <button onclick="showLayer('theme-layer')">Theme Map</button>
  </div>

  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibWVyb253YiIsImEiOiJjbWt5eXZtZmIwZTRiM2RuM2NmMW51NTJsIn0.Ed7Mtil9vLyQb-7MMOBfiQ';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v10',
      center: [-122.3321, 47.6062],
      zoom: 10
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');
    map.addControl(new mapboxgl.ScaleControl());

    map.on('load', () => {
      map.addSource('basemap', {
        type: 'raster',
        tiles: ['basemap/{z}/{x}/{y}.png'],
        tileSize: 256
      });

      map.addLayer({
        id: 'basemap-layer',
        type: 'raster',
        source: 'basemap',
        layout: {
          visibility: 'visible'
        }
      });

      map.addSource('thematic', {
        type: 'raster',
        tiles: ['thematic/{z}/{x}/{y}.png'],
        tileSize: 256
      });

      map.addLayer({
        id: 'thematic-layer',
        type: 'raster',
        source: 'thematic',
        layout: {
          visibility: 'none'
        }
      });

      map.addSource('combined', {
        type: 'raster',
        tiles: ['combined/{z}/{x}/{y}.png'],
        tileSize: 256
      });

      map.addLayer({
        id: 'combined-layer',
        type: 'raster',
        source: 'combined',
        layout: {
          visibility: 'none'
        }
      });

      map.addSource('theme', {
        type: 'raster',
        tiles: ['theme/{z}/{x}/{y}.png'],
        tileSize: 256
      });

      map.addLayer({
        id: 'theme-layer',
        type: 'raster',
        source: 'theme',
        layout: {
          visibility: 'none'
        }
      });
    });

    function showLayer(selectedLayer) {
      const layers = [
        'basemap-layer',
        'thematic-layer',
        'combined-layer',
        'theme-layer'
      ];

      for (let i = 0; i < layers.length; i++) {
        if (map.getLayer(layers[i])) {
          map.setLayoutProperty(layers[i], 'visibility', 'none');
        }
      }

      if (map.getLayer(selectedLayer)) {
        map.setLayoutProperty(selectedLayer, 'visibility', 'visible');
      }
    }
  </script>
</body>
</html>
