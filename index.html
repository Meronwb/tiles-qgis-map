<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My Tile Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    #menu {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      background: white;
      padding: 10px;
      border-radius: 6px;
    }

    #menu button {
      display: block;
      margin: 5px 0;
      width: 120px;
    }
  </style>
</head>

<body>
  <div id="menu">
    <button onclick="toggleLayer('basemap-layer')">Basemap</button>
    <button onclick="toggleLayer('heatmap-layer')">Heatmap</button>
    <button onclick="toggleLayer('combined-layer')">Combined</button>
  </div>

  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibWVyb253YiIsImEiOiJjbWt5eXZtZmIwZTRiM2RuM2NmMW51NTJsIn0.Ed7Mtil9vLyQb-7MMOBfiQ';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v10',
      center: [-122.3, 47.6],
      zoom: 10
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');
    map.addControl(new mapboxgl.ScaleControl());

    map.on('load', () => {
      map.addSource('basemap', {
        type: 'raster',
        tiles: ['assets/basemap/{z}/{x}/{y}.png'],
        tileSize: 256
      });

      map.addLayer({
        id: 'basemap-layer',
        type: 'raster',
        source: 'basemap',
        layout: { visibility: 'visible' }
      });

      map.addSource('heatmap', {
        type: 'raster',
        tiles: ['assets/heatmap/{z}/{x}/{y}.png'],
        tileSize: 256
      });

      map.addLayer({
        id: 'heatmap-layer',
        type: 'raster',
        source: 'heatmap',
        layout: { visibility: 'none' }
      });

      map.addSource('combined', {
        type: 'raster',
        tiles: ['assets/combined/{z}/{x}/{y}.png'],
        tileSize: 256
      });

      map.addLayer({
        id: 'combined-layer',
        type: 'raster',
        source: 'combined',
        layout: { visibility: 'none' }
      });
    });

    function toggleLayer(layer) {
      const visibility = map.getLayoutProperty(layer, 'visibility');

      if (visibility === 'visible') {
        map.setLayoutProperty(layer, 'visibility', 'none');
      } else {
        map.setLayoutProperty(layer, 'visibility', 'visible');
      }
    }
  </script>
</body>
</html>
